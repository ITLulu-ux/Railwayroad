<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>철도 조회 시스템</title>

    <link rel="stylesheet" href="https://cdn3.devexpress.com/jslib/23.2.4/css/dx.common.css">
    <link rel="stylesheet" href="https://cdn3.devexpress.com/jslib/23.2.4/css/dx.material.blue.light.compact.css">
    <link rel="stylesheet" href="https://cdn3.devexpress.com/jslib/23.2.4/css/dx.material.blue.light.css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.css">
    <style>
        body {
            font-family: 'Malgun Gothic',
            sans-serif;
            background-color: rgb(245 247 250 / 0.6);
            margin: 5%;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .menu-container{
            display:flex;
            justify-content:center;
            gap:30px;
        }

        .high_speed_train{
            width:400px;
            height:300px;
            background-color: rgb(165 193 106 / 0.6);
            cursor: pointer;
            :hover
        }

        .total{
            width:400px;
            height:300px;
            background-color: rgb(17 216 216 / 0.6);
            cursor: pointer;
            :hover
        }

        .high_speed_train img,
        .total img{
            width: 300px;
            height: auto;
            margin-bottom: 30px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
<div class="header">
    <h1>철도 조회 시스템</h1>
</div>
<div class="menu-container">
    <div class="high_speed_train" onclick="location.href='/list'">
        <h2>철도 통합 조회</h2>
        <p> DataGrid 기반 조회 </p>

        <img src="/images/main_train.jpg" style="display: block; margin: 0 auto; width: 50%;">
    </div>

    <div class="total" onclick="location.href='/view'">
        <h2>철도 상세 분석</h2>
        <p> 차트 기반 시각화 </p>

        <img src="/images/main_chart.jpg" style="display: block; margin: 0 auto; width: 50%;">
    </div>
</div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn3.devexpress.com/jslib/23.2.4/js/dx.all.js"></script>
<script src="https://cdn3.devexpress.com/jslib/23.2.4/js/dx-quill.js"></script>
</body>
</html>
